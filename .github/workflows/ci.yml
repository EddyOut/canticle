name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# GitHub-hosted runners only. On a public repository a pull request from any
# fork can run code on a self-hosted runner (CLAUDE.md).
# Actions are pinned to commit SHAs; the tag each SHA was taken from is noted.

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm check:boundaries

  # Contributions from outside Mandorum arrive from forks and must be signed
  # off (CONTRIBUTING.md). The checker and its dependencies come from the base
  # commit, so a pull request cannot change the code that judges it. The
  # checker's command-line entry imports modules that need installed
  # dependencies, so they are installed here even though dco itself uses none.
  dco:
    name: dco
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the pull request's commits
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR}/head"
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format='%H%x1f%P%x1f%an%x1f%ae%x1f%B%x1e' "${BASE}..${HEAD}" \
            | node tools/repo-checks/src/cli.ts dco

  # The one check branch protection requires. It fails unless every gate
  # actually reported: a skipped or cancelled job is not a pass.
  verdict:
    name: verdict
    if: always()
    needs: [check, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required gate succeeded
        env:
          CHECK: ${{ needs.check.result }}
          DCO: ${{ needs.dco.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "check=${CHECK} dco=${DCO} fork_pr=${FORK_PR}"
          if [ "${CHECK}" != success ]; then
            echo "::error::check did not succeed (${CHECK})"
            exit 1
          fi
          if [ "${FORK_PR}" = true ]; then
            if [ "${DCO}" != success ]; then
              echo "::error::dco did not succeed (${DCO})"
              exit 1
            fi
          elif [ "${DCO}" != skipped ]; then
            echo "::error::dco runs only for pull requests from forks, but reported ${DCO}"
            exit 1
          fi
