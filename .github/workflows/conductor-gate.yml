name: conductor-gate

# Only the Conductor merges (CLAUDE.md). Every session shares one GitHub
# account, so required reviews cannot tell reviewer from author; this check
# can. It is red on every pull request until the `conductor-approved` label is
# applied, and applying that label is the Conductor's merge ritual alone.
#
# An approval covers only the head it was given: a new push removes the label
# before judging, so a head the Conductor never saw cannot ride a stale
# approval to green.
#
# pull_request_target runs this file from the base branch with a token that
# can edit labels, which pull requests from forks need. It is safe here only
# because this workflow never checks out or runs code from the pull request,
# and never interpolates text an author controls into a shell command. Keep it
# that way.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: conductor-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  conductor-gate:
    name: conductor-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: A new head revokes the old approval
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",${LABELS}," in
            *,conductor-approved,*)
              echo "Head changed after approval; removing conductor-approved so the Conductor re-verifies this head."
              gh pr edit "${PR}" --repo "${REPO}" --remove-label conductor-approved ;;
            *)
              echo "No standing approval to revoke." ;;
          esac
      - name: The Conductor has approved this head
        env:
          EVENT: ${{ github.event.action }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "${EVENT}" = synchronize ]; then
            echo "::error::Head ${HEAD} arrived after any approval and has not been verified by the Conductor."
            exit 1
          fi
          case ",${LABELS}," in
            *,conductor-approved,*)
              echo "conductor-approved is present for head ${HEAD}." ;;
            *)
              echo "::error::Awaiting the Conductor. The conductor-approved label is applied only by the Conductor as its merge ritual."
              exit 1 ;;
          esac
